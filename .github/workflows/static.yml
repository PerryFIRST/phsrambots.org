# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Keep the gallery manifest (see below) fresh even when nothing is pushed
  schedule:
    - cron: "0 12 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build gallery manifest
        # Fetches the photo listing from the GitHub API server-side (at deploy time,
        # authenticated, 5000 req/hour) so gallery/index.html only has to read a local
        # JSON file at runtime instead of hitting the API's 60 req/hour anonymous limit.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/gallery
          # github.repository keeps this correct across repo renames/transfers; -L follows
          # GitHub's 301 for moved repos (without it the 301 body gets parsed as the listing).
          if curl -sfL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/contents/data/gallery" \
              -o /tmp/gallery-raw.json \
              && jq -e 'type == "array"' /tmp/gallery-raw.json > /dev/null; then
            jq '[.[] | select(.type=="file") | select(.name | test("\\.(jpe?g|png|gif|webp)$"; "i")) | {name: .name, download_url: .download_url}]' \
              /tmp/gallery-raw.json > data/gallery/manifest.json
          else
            echo "Gallery API fetch failed or returned no listing; skipping manifest, page will fall back to the live API"
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
